name: Harness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest build
      - run: python -m pytest -q
      - run: python -m build
      - run: seer-agent run --mission examples/person_detection/mission.json --input examples/person_detection/events.jsonl --db runs/person.sqlite --demo --replay
      - run: seer-agent run --mission examples/oil_leak/mission.json --input examples/oil_leak/events.jsonl --db runs/oil.sqlite --demo --replay
